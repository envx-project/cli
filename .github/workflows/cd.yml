name: CD

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      envx_version: ${{ env.ENVX_VERSION }}
      build: ${{ env.BUILD }}
    steps:
      # release-please-config.json keeps releases draft until publish-release
      # has every asset, so /releases/latest stays installable, and forces the
      # tag immediately so the next changelog can find it.
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set SemVer String
        id: set-semver
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "ENVX_VERSION=${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> $GITHUB_ENV
          echo "BUILD=true" >> $GITHUB_ENV

  build-release:
    name: Build Release
    needs: [release-please]
    if: needs.release-please.outputs.build == 'true'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          # - target: i686-unknown-linux-musl
          #   os: ubuntu-latest
          #   install-musl: true

          # - target: aarch64-unknown-linux-musl
          #   os: ubuntu-latest

          # - target: arm-unknown-linux-musleabihf
          #   os: ubuntu-latest

          - target: x86_64-apple-darwin
            os: macOS-latest

          - target: aarch64-apple-darwin
            os: macOS-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          # - target: i686-pc-windows-msvc
          #   os: windows-latest

          - target: x86_64-pc-windows-gnu
            os: windows-latest

          # - target: i686-pc-windows-gnu
          #   os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install system dependencies
        run: sudo apt update && sudo apt install -y make libssl-dev pkg-config
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Install musl build dependencies
        run: sudo apt install -y musl-tools musl-dev curl make perl
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build supported OpenSSL LTS for musl
        run: ./scripts/build-musl-openssl.sh "$RUNNER_TEMP/musl-openssl"
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        if: ${{ matrix.target != 'x86_64-unknown-linux-musl' }}

      - name: Build (MUSL)
        run: OPENSSL_DIR="$RUNNER_TEMP/musl-openssl" OPENSSL_STATIC=true cargo build --release --locked --target ${{ matrix.target }}
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Prepare binaries (zip) [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          strip envx.exe
          7z a ../../../envx-${{ needs.release-please.outputs.envx_version }}-${{ matrix.target }}.zip envx.exe
          cd -
      - name: Prepare binaries (tar) [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          strip envx.exe
          7z a -ttar archive.tar envx.exe
          7z a -tgzip ../../../envx-${{ needs.release-please.outputs.envx_version }}-${{ matrix.target }}.tar.gz archive.tar
          cd -
      - name: Prepare binaries [-linux]
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          strip envx || true
          tar czvf ../../../envx-${{ needs.release-please.outputs.envx_version }}-${{ matrix.target }}.tar.gz envx
          cd -

      - name: Create release SHA256 sidecars
        shell: bash
        run: |
          for archive in envx-${{ needs.release-please.outputs.envx_version }}-${{ matrix.target }}.*; do
            case "$archive" in *.tar.gz|*.zip) ;; *) continue ;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          done

      # gh finds draft releases by tag; the REST releases/tags/{tag} endpoint cannot.
      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.envx_version }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "v$VERSION" envx-"$VERSION"-"$TARGET"* --clobber --repo "$GITHUB_REPOSITORY"

      # - name: Install cargo-deb
      #   if: matrix.target == 'x86_64-unknown-linux-musl'
      #   run: cargo install cargo-deb
      #
      # - name: Generate .deb package file
      #   if: matrix.target == 'x86_64-unknown-linux-musl'
      #   run: cargo deb --target x86_64-unknown-linux-musl --output envx-${{ needs.release-please.outputs.envx_version }}-amd64.deb
      #
      # - name: Upload .deb package file
      #   if: matrix.target == 'x86_64-unknown-linux-musl'
      #   uses: svenstaro/upload-release-action@v2
      #   with:
      #     tag: ${{ needs.release-please.outputs.envx_version }}
      #     file: envx-${{ needs.release-please.outputs.envx_version }}-amd64.deb

  # Skipped unless every build-release leg succeeded, leaving the draft
  # unpublished. Recover with "Re-run failed jobs"; a full re-run does not
  # re-emit release_created for an existing release.
  publish-release:
    name: Publish Release
    needs: [release-please, build-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # make_latest=legacy picks latest by version and date, so a delayed
      # older release cannot displace a newer one.
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release-please.outputs.envx_version }}
        run: |
          id=$(gh release view "$TAG" --json databaseId --jq .databaseId --repo "$GITHUB_REPOSITORY")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=legacy
