name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }} - ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: CLI output and local alias smoke test
        if: runner.os == 'Linux'
        run: ENVX_TEST_COMMAND="$PWD/target/debug/envx" python3 tests/human_output.py
      - run: cargo test --locked
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  installer:
    name: Isolated installer smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm --network none -v "$PWD:/src:ro" python:3.12-slim python /src/tests/installer.py
